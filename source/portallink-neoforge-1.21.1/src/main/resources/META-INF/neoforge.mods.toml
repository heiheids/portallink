# Portal Link (Nether Portal Linkage Preview) - NeoForge 26.3
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerURL = "https://github.com/heiheids/portallink"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "Portal Link (Nether Portal Linkage Preview)"
authors = "黑山大叔"
