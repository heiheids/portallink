// Portal Link - NeoForge 1.21.1 build script
plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group
base.archivesName = "portallink-${minecraft_version}-neoforge"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', mod_id
    inputs.property 'loader_version_range', loader_version_range
    inputs.property 'neo_version_range', neo_version_range
    inputs.property 'minecraft_version_range', minecraft_version_range
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(['version': project.version,
                'mod_id': mod_id,
                'loader_version_range': loader_version_range,
                'neo_version_range': neo_version_range,
                'minecraft_version_range': minecraft_version_range])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
